[project]
name = "wechat-bot"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=44",
    "uiautomator2>=3.7,<4",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlcipher3>=0.6.5,<0.7",
    "zstandard>=0.23,<1",
    "structlog>=25,<27",
]

[project.scripts]
dev-server = "server.__main__:main"
dev-web = "server.__main__:web_main"
dev-sender = "send:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["server", "sender"]

[tool.setuptools]
py-modules = ["send"]
