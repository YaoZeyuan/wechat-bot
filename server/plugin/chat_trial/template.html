<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>群聊审判预览</title>
<style>
:root{color-scheme:light;--ink:#232426;--muted:#575a60;--line:#d9dade;--paper:#fff}
*{box-sizing:border-box}
body{margin:0;background:#eeeff1;color:var(--ink);font:16px/1.75 "Microsoft YaHei UI","PingFang SC",system-ui,sans-serif}
main{width:80vw;margin:clamp(16px,5vw,64px) auto;background:var(--paper);border:1px solid var(--line);border-top:5px solid #292b2f;padding:clamp(18px,6vw,64px)}
header{padding:0 0 26px;margin-bottom:24px;border-bottom:3px double #a4a6ab}
h1{font:700 clamp(30px,6vw,48px)/1.25 "Songti SC",SimSun,serif;letter-spacing:.07em;margin:0}
h2{margin:0;font:700 25px/1.5 "Songti SC",SimSun,serif}
small{color:var(--muted);font-size:13px;font-weight:400}
details{border-bottom:1px solid var(--line)}
summary{padding:13px 8px;cursor:pointer;font-weight:650}
summary:hover{background:#f4f4f5}
summary small{display:inline-block;margin-left:12px}
article{padding:8px 12px 16px}
section{margin-top:34px;padding-top:18px;border-top:2px solid #292b2f}
article,section{overflow:auto;overflow-wrap:anywhere}
table{border-collapse:collapse;width:100%;font-size:14px;margin-top:14px}
td,th{border-bottom:1px solid var(--line);padding:10px;text-align:left;vertical-align:top}
th{background:#eeeff1}
pre{white-space:pre-wrap;font:inherit;background:#f3f3f4;padding:14px}
button{border:1px solid #8e9197;border-radius:4px;background:white;color:var(--ink);padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
:focus-visible{outline:2px solid #555960;outline-offset:3px}
@media(max-width:760px){main{width:calc(100% - 24px)}}
@media(max-width:480px){summary small{display:block;margin-left:18px}td,th{padding:7px}section{margin-top:24px}}
.original-panel{position:relative}
.original-panel summary{padding-right:132px;min-height:48px}
.original-panel button{position:absolute;right:0;top:6px;z-index:1}
</style>
<main><header><h1>群聊审判</h1></header>

<div class="original-panel"><button type="button" id="copy">复制原始内容</button>
<details><summary>审判原始内容</summary><article><pre id="original">$original</pre>
</article></details></div>
$cards
<section><h2>终审汇总</h2><small>$clerk · $seconds 秒</small>$summary</section>

</main><script>
document.querySelector('#copy').onclick = async (event) => {
  await navigator.clipboard.writeText(document.querySelector('#original').textContent);
  event.target.textContent = '已复制';
};
</script></html>
